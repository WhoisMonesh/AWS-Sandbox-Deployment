# CronJob: scheduled run (here every 5 minutes, for demo).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: practice
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: busybox:1.36
              command: ["sh", "-c", "echo 'tick $(date)'"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi

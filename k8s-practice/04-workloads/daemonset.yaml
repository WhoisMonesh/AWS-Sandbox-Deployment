# DaemonSet: one Pod per (matching) node — e.g. log collectors, node agents.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: practice
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi

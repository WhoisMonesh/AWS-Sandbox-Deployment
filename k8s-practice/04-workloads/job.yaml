# Job: run-to-completion workload (one successful Pod ends it).
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
  namespace: practice
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Job done at $(date)'; sleep 5"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi

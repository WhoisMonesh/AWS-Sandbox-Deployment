# RBAC: a ServiceAccount + Role + RoleBinding giving read-only access to Pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: practice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: practice
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: practice
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: practice
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# Try it:
#   kubectl auth can-i list pods --as=system:serviceaccount:practice:reader
#   kubectl --as=system:serviceaccount:practice:reader get pods

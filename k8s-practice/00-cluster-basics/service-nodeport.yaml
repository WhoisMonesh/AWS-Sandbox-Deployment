# ClusterIP (in-cluster only) and NodePort (reachable on each node's IP) services.
# For external access from your laptop use: kubectl port-forward svc/nginx 8080:80
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: practice
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: practice
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

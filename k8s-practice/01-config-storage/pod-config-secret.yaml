# Pod that consumes the ConfigMap (env + volume) and Secret (env).
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: practice
spec:
  containers:
    - name: app
      image: nginx:1.27
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: API_KEY
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: html
      configMap:
        name: app-config
        items:
          - key: index.html
            path: index.html
